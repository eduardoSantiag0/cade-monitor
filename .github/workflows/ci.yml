name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "false"
      # Chave não-padrão só para o job de CI — nunca use um valor real aqui.
      # Também exercita a validação de SECRET_KEY do FR-003 como smoke test.
      SECRET_KEY: "ci-nao-usar-em-producao-${{ github.run_id }}"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python manage.py test tests --verbosity=2
